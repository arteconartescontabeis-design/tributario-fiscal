name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Suíte do Análise Tributária (motor + lacre)
        run: node tests/run.js

      - name: Suíte da Simulação de Incorporação (lacre copiado = lacre do index)
        # incorporacao/index.html é GERADO a partir de analise-tributaria-pro/index.html + incorporacao/src/.
        # Se o ATP re-selar o lacre, rode `node tools/build_incorporacao.js` antes de publicar.
        run: node tests/run_incorporacao.js

      - name: Suíte da Análise Imobiliária (UI em jsdom + testes de aceite)
        run: |
          npm i --no-save jsdom@24
          node tests/run_imob_ui.js
